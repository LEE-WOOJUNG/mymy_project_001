<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여행 기록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="lock" class="lock">
  <form class="lock-card" onsubmit="event.preventDefault();tryUnlock()">
    <div class="lock-icon">✈</div>
    <div class="eyebrow">Travel Journal</div>
    <h1>여행 기록</h1>
    <p class="lock-sub">비밀번호를 입력해 주세요</p>
    <input type="password" id="pw" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호" autofocus>
    <div class="lock-err" id="pwErr" aria-live="polite"></div>
    <button type="submit" class="btn primary lock-btn">들어가기</button>
    <button type="button" class="hint-toggle" onclick="toggleHint()">힌트 보기</button>
    <div class="hint" id="hint" hidden>Our beginning</div>
  </form>
</div>
<div class="wrap" id="app" hidden></div>

<dialog id="modal">
  <form id="modalForm">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button type="button" class="btn" onclick="closeModal()">취소</button>
      <button type="submit" class="btn primary" id="modalOk">저장</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script src="js/app.js"></script>
</body>
</html>
