<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여행 기록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface2:#f1efe9; --surface3:#e9e6de; --line:#e6e2d8; --line-strong:#d6d1c4;
  --text:#1b1a17; --text2:#4a4740; --muted:#8c877b;
  --accent:#0f6b61; --accent-2:#13897c; --accent-soft:#e2f0ec; --on-accent:#ffffff;
  --warn:#c4462a; --warn-soft:#fbe9e4; --card:#3f51b5; --cash:#2e7d4f; --sel:#fff6d8; --gold:#b7862b;
  --shadow-sm:0 1px 2px rgba(28,25,20,.05);
  --shadow:0 1px 2px rgba(28,25,20,.04),0 6px 20px -6px rgba(28,25,20,.10);
  --shadow-lg:0 2px 4px rgba(28,25,20,.05),0 18px 40px -12px rgba(28,25,20,.22);
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121311; --surface:#1b1c1a; --surface2:#232522; --surface3:#2c2f2b; --line:#2f322e; --line-strong:#3e423c;
    --text:#efede7; --text2:#c9c6be; --muted:#8f8b81;
    --accent:#4fc1b2; --accent-2:#6fd3c5; --accent-soft:#183531; --on-accent:#08201d;
    --warn:#ff8f73; --warn-soft:#3a201a; --card:#93a6ff; --cash:#74d498; --sel:#3a3418; --gold:#e0b55c;
    --shadow-sm:none; --shadow:0 0 0 1px rgba(255,255,255,.02); --shadow-lg:0 20px 40px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#121311; --surface:#1b1c1a; --surface2:#232522; --surface3:#2c2f2b; --line:#2f322e; --line-strong:#3e423c;
  --text:#efede7; --text2:#c9c6be; --muted:#8f8b81;
  --accent:#4fc1b2; --accent-2:#6fd3c5; --accent-soft:#183531; --on-accent:#08201d;
  --warn:#ff8f73; --warn-soft:#3a201a; --card:#93a6ff; --cash:#74d498; --sel:#3a3418; --gold:#e0b55c;
  --shadow-sm:none; --shadow:0 0 0 1px rgba(255,255,255,.02); --shadow-lg:0 20px 40px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);
  font:15px/1.55 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-soft)}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.03em}
h2{font-size:19px;margin:0 0 12px;font-weight:750;letter-spacing:-.02em}
h3{font-size:15px;margin:0;font-weight:700;letter-spacing:-.015em}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;white-space:nowrap;font-weight:600;font-size:14px;
  box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--surface2);border-color:var(--line-strong)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 4px 12px -4px color-mix(in srgb,var(--accent) 60%,transparent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.sm{padding:6px 12px;font-size:13px}
.icon-btn{border:none;background:none;width:30px;height:30px;padding:0;border-radius:8px;color:var(--muted);display:inline-grid;place-items:center;font-size:14px;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.icon-btn.del:hover{background:var(--warn-soft);color:var(--warn)}
.icon-btn[disabled]{opacity:.3;cursor:default}

/* Surfaces & fields */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select,textarea{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 12px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--line-strong)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:12px}
label.f > input,label.f > select,label.f > textarea{margin-top:6px;color:var(--text);font-weight:400;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
.badge.gray{background:var(--surface2);color:var(--text2);font-weight:600}
.badge.card{background:color-mix(in srgb,var(--card) 13%,transparent);color:var(--card)}
.badge.cash{background:color-mix(in srgb,var(--cash) 13%,transparent);color:var(--cash)}
.empty{text-align:center;padding:64px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:6px}

/* Home */
.hero{position:relative;border-radius:24px;padding:34px 32px;margin-bottom:28px;overflow:hidden;color:#fff;
  background:radial-gradient(120% 140% at 100% 0%,#2aa395 0%,transparent 55%),linear-gradient(135deg,#0c4f48 0%,#12352f 100%);box-shadow:var(--shadow-lg)}
.hero::after{content:"✈";position:absolute;right:28px;bottom:-26px;font-size:150px;opacity:.08;transform:rotate(-12deg)}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.hero h1{font-size:32px;color:#fff;margin:6px 0 6px}
.hero p{margin:0;opacity:.75;font-size:14px}
.hero .row{margin-top:20px;position:relative;z-index:1}
.hero .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.hero .btn:hover{background:rgba(255,255,255,.2)}
.hero .btn.primary{background:#fff;color:#0c4f48;border-color:#fff}
.section-title{display:flex;align-items:baseline;gap:8px;margin:0 0 14px}
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.trip-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s;position:relative;overflow:hidden}
.trip-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.trip-card .cover{height:96px;padding:16px 18px;display:flex;align-items:flex-start;justify-content:space-between;color:#fff;
  background:radial-gradient(90% 120% at 100% 0%,hsl(var(--h) 55% 58%) 0%,transparent 60%),linear-gradient(135deg,hsl(var(--h) 45% 34%),hsl(calc(var(--h) + 30) 40% 24%))}
.trip-card .cover .dday{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.trip-card .body{padding:16px 18px 18px}
.trip-card .dest{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.02em}
.trip-card .name{font-size:18px;font-weight:800;margin:3px 0 4px;letter-spacing:-.025em;line-height:1.35}
.trip-card .acts{position:absolute;top:12px;right:12px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.trip-card:hover .acts,.trip-card:focus-within .acts{opacity:1}
.trip-card .acts .icon-btn{background:rgba(0,0,0,.25);color:#fff;backdrop-filter:blur(6px)}
.trip-card .acts .icon-btn:hover{background:rgba(0,0,0,.45)}
.trip-card .cover .dday{margin-left:auto}
.trip-card:hover .cover .dday{opacity:0}
.trip-card .stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
@media (hover:none){.trip-card .acts{opacity:1}.trip-card .cover .dday{opacity:0}}

/* Trip header + tabs */
.trip-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.trip-head .back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;box-shadow:var(--shadow-sm)}
.trip-head .back:hover{background:var(--surface2)}
.trip-head .meta{font-size:13px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:4px;background:color-mix(in srgb,var(--surface) 75%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);padding:5px;border-radius:16px;margin-bottom:22px;position:sticky;top:10px;z-index:5;overflow-x:auto;box-shadow:var(--shadow)}
.tab{flex:1;border:none;background:none;padding:10px 14px;border-radius:11px;color:var(--muted);font-weight:650;white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{color:var(--text)}
.tab.on{background:var(--text);color:var(--bg)}

/* Calendar */
.sched{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:start}
.sched > .panel:last-child{position:sticky;top:84px}
.month{margin-bottom:20px}
.month-title{font-weight:800;font-size:17px;letter-spacing:-.02em;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0 4px}
.wd.sun{color:var(--warn)}
.cell{min-height:80px;border:1px solid transparent;border-radius:12px;background:transparent;text-align:left;padding:7px;display:flex;flex-direction:column;gap:3px;overflow:hidden;color:var(--muted);transition:border-color .15s,background .15s,transform .1s}
.cell[disabled]{cursor:default;opacity:.35}
.cell.in{background:var(--surface2);color:var(--text);border-color:transparent}
.cell.in:hover{border-color:var(--accent);background:var(--surface)}
.cell.sel{background:var(--accent)!important;border-color:var(--accent);color:var(--on-accent)}
.cell.sel .stay,.cell.sel .cnt{color:var(--on-accent);opacity:.9}
.cell .dn{font-weight:800;font-size:13px}
.cell.today:not(.sel) .dn{color:var(--accent)}
.cell.today .dn::after{content:"오늘";font-size:10px;font-weight:700;margin-left:4px;opacity:.8}
.cell .stay{font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent);font-weight:600}
.cell .cnt{font-size:11px;color:var(--muted);margin-top:auto}
.stay-box{background:var(--accent-soft);border-radius:14px;padding:14px 16px;margin:14px 0 20px;border:1px solid color-mix(in srgb,var(--accent) 18%,transparent)}
.stay-box b{font-size:15px}
.timeline{position:relative;margin-top:12px}
.tl-item{display:grid;grid-template-columns:54px 18px 1fr auto;gap:10px;align-items:start;padding:8px 0}
.tl-time{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px;text-align:right;padding-top:1px}
.tl-time .end{display:block;font-weight:500;color:var(--muted);font-size:12px}
.tl-dot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);margin-top:4px;position:relative}
.tl-item:not(:last-child) .tl-dot::after{content:"";position:absolute;left:2.5px;top:14px;width:2px;height:calc(100% + 44px);background:var(--line)}
.tl-body{background:var(--surface2);border-radius:12px;padding:10px 12px}
.tl-body b{display:block;font-weight:700}
.tl-body .memo{font-size:13px;color:var(--muted);white-space:pre-wrap;margin-top:2px}

/* Prep */
.people{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 6px;font-size:14px;font-weight:600}
.chip::before{content:attr(data-i);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:800}
.chip button{border:none;background:none;color:var(--muted);width:22px;height:22px;border-radius:50%;padding:0}
.chip.tag{padding-left:12px;gap:4px}
.chip.tag::before{display:none}
.chip.tag .tag-name{cursor:pointer}
.chip.tag .tag-name:hover{color:var(--accent);text-decoration:underline}
.chip.tag .tag-n{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface3);border-radius:99px;padding:0 7px;margin-left:2px}
.chip button:hover{background:var(--warn-soft);color:var(--warn)}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .3s}
.table-wrap{overflow-x:auto;margin:0 -4px}
table.prep{width:100%;border-collapse:separate;border-spacing:0}
table.prep th{font-size:11.5px;color:var(--muted);font-weight:700;padding:8px 6px;text-align:center;white-space:nowrap;letter-spacing:.02em}
table.prep th:first-child{text-align:left;padding-left:10px}
table.prep td{padding:9px 6px;border-top:1px solid var(--line);text-align:center;vertical-align:middle}
table.prep tbody tr:not(.cat):hover td{background:var(--surface2)}
table.prep td.item{text-align:left;cursor:pointer;font-weight:550;padding-left:10px}
table.prep td.acts{white-space:nowrap;text-align:right}
table.prep .grip-cell{width:28px;padding:0 0 0 4px !important;text-align:center}
.drag-handle{border:none;background:none;width:26px;height:32px;border-radius:7px;color:var(--line-strong);display:inline-grid;place-items:center;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:color .15s,background .15s}
tr:hover .drag-handle,.drag-handle:focus-visible{color:var(--muted)}
.drag-handle:hover{background:var(--surface3);color:var(--text)}
table.prep tr.pressing .drag-handle{color:var(--accent);transform:scale(1.15)}
table.prep tr.dragging td{background:var(--accent-soft) !important;border-top-color:transparent}
table.prep tr.dragging .drag-handle{color:var(--accent);cursor:grabbing}
table.prep tr.dragging td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
body.is-dragging,body.is-dragging *{cursor:grabbing !important;-webkit-user-select:none;user-select:none}
table.prep tr.moved td{animation:flash 1s ease-out}
@keyframes flash{from{background:var(--sel)}to{background:transparent}}
table.prep tr.cat td{border-top:none;padding:18px 10px 6px;text-align:left;font-weight:800;font-size:12px;color:var(--accent);letter-spacing:.06em}
table.prep tr.done td.item{text-decoration:line-through;text-decoration-color:var(--line-strong);color:var(--muted)}
table.prep input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--surface);cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle;transition:background .15s,border-color .15s}
table.prep input[type=checkbox]:hover{border-color:var(--accent)}
table.prep input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
table.prep input[type=checkbox]:checked::after{content:"";width:5px;height:10px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
table.prep td.memo-cell{min-width:170px;width:30%;text-align:left}
.memo-in{border:1px solid transparent !important;background:transparent !important;padding:6px 9px !important;font-size:13px;color:var(--text2)}
.memo-in::placeholder{color:var(--line-strong)}
.memo-in:hover{border-color:var(--line) !important;background:var(--surface) !important}
.memo-in:focus{border-color:var(--accent) !important;background:var(--surface) !important;color:var(--text)}

/* Flights */
.flight{margin-bottom:16px;padding:0;overflow:hidden}
.flight-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-bottom:1px dashed var(--line-strong);background:var(--surface2)}
.flight-head b{font-size:15px;letter-spacing:.02em}
.flight > .seg,.flight > .layover,.flight > .small{margin-left:18px;margin-right:18px}
.flight-head{margin-bottom:6px}
.flight > :last-child{margin-bottom:18px}
.seg{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:14px 4px}
.seg .ap{font-size:30px;font-weight:850;letter-spacing:-.01em;line-height:1.1}
.seg .t{font-size:13px;color:var(--text2);margin-top:2px}
.seg .mid{text-align:center;font-size:12px;color:var(--muted);min-width:140px;font-weight:600}
.seg .mid .line{border-top:1.5px dashed var(--line-strong);margin:10px 0;position:relative}
.seg .mid .line::after{content:"✈";position:absolute;left:50%;top:-11px;transform:translateX(-50%);background:var(--surface);padding:0 6px;color:var(--accent);font-size:15px}
.seg .right{text-align:right}
.layover{margin:2px 0;padding:8px 12px;border-radius:10px;background:var(--warn-soft);font-size:13px;font-weight:600;color:var(--warn)}
fieldset.segf{border:1px solid var(--line);border-radius:14px;padding:12px 14px 2px;margin:0 0 12px;background:var(--surface2)}
fieldset.segf legend{font-size:12.5px;font-weight:800;padding:0 6px;color:var(--accent)}

/* Expenses */
.sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.sum::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line-strong)}
.sum:first-child::before{background:var(--text)}
.sum.card::before{background:var(--card)} .sum.cash::before{background:var(--cash)}
.sum .k{font-size:12px;color:var(--muted);font-weight:600}
.sum .v{font-size:24px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:2px 0}
.sum.card .v{color:var(--card)} .sum.cash .v{color:var(--cash)}
.bar-row{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;font-size:13px;margin:8px 0;font-weight:550}
.bar-row > span:last-child{font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px}
.exp-day{font-size:12px;font-weight:800;color:var(--muted);margin:18px 0 4px;display:flex;justify-content:space-between;letter-spacing:.02em}
.exp{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.exp .ic{font-size:18px;width:38px;height:38px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:none}
.exp .info{flex:1;min-width:0;font-weight:600}
.exp .info .row{font-weight:500;margin-top:2px}
.exp .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg-ctl{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px}
.seg-ctl button{border:none;background:none;padding:5px 13px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:650}
.seg-ctl button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.cur-head{display:flex;align-items:baseline;gap:8px;margin:4px 0 8px}
.cur-code{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--accent)}
.sub-h{font-size:12px;font-weight:800;color:var(--muted);margin:14px 0 4px;padding-top:12px;border-top:1px solid var(--line);letter-spacing:.02em}
.cur-picks{display:flex;flex-wrap:wrap;gap:6px}
.cur-pick{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12.5px;font-weight:700;color:var(--text2)}
.cur-pick span{font-weight:500;color:var(--muted)}
.cur-pick:hover{border-color:var(--accent)}
.cur-pick.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cur-pick.on span{color:var(--on-accent);opacity:.8}
.exp-cols{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;align-items:start}

/* Lock screen */
.lock{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;
  background:radial-gradient(80% 70% at 85% 10%,#2aa395 0%,transparent 60%),linear-gradient(150deg,#0c4f48 0%,#102b27 100%)}
.lock[hidden]{display:none}
.lock-card{width:min(360px,100%);background:var(--surface);border-radius:24px;padding:34px 28px 24px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:stretch}
.lock-icon{width:56px;height:56px;margin:0 auto 14px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:26px}
.lock-card .eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.lock-card h1{font-size:26px;margin:4px 0 4px}
.lock-sub{margin:0 0 20px;color:var(--muted);font-size:14px}
.lock-card input{text-align:center;font-size:18px !important;letter-spacing:.3em;padding:12px !important}
.lock-card input::placeholder{letter-spacing:0;font-size:15px}
.lock-err{min-height:20px;font-size:13px;color:var(--warn);margin:6px 0 4px;font-weight:600}
.lock-btn{padding:12px;font-size:15px}
.hint-toggle{border:none;background:none;color:var(--muted);font-size:11.5px;margin-top:16px;padding:4px;text-decoration:underline;text-underline-offset:3px;align-self:center}
.hint-toggle:hover{color:var(--text2)}
.hint{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:2px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* Modal & toast */
dialog{border:1px solid var(--line);border-radius:22px;padding:0;background:var(--surface);color:var(--text);width:min(580px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:var(--shadow-lg)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
dialog::backdrop{background:rgba(15,14,12,.45);backdrop-filter:blur(3px)}
dialog form{padding:24px;display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
#modalTitle{font-size:18px;font-weight:800}
#modalBody{overflow-y:auto;margin:18px -6px;padding:2px 6px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:var(--shadow-lg);z-index:100}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .sched,.exp-cols{grid-template-columns:1fr}
  .sched > .panel:last-child{position:static}
  .sum-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){
  .wrap{padding:16px 16px 60px}
  .hero{padding:26px 22px;border-radius:20px}
  .hero h1{font-size:26px}
  .panel{padding:16px}
  .grid2,.grid3{grid-template-columns:1fr}
  .cal{gap:3px}
  .cell{min-height:60px;padding:4px;border-radius:9px}
  .cell .stay{font-size:10px}
  .cell.today .dn::after{display:none}
  .seg .ap{font-size:22px}
  .seg .mid{min-width:80px}
  .tab{padding:9px 6px;font-size:13.5px}
  .sum .v{font-size:19px}
}
</style>
</head>
<body>
<div id="lock" class="lock">
  <form class="lock-card" onsubmit="event.preventDefault();tryUnlock()">
    <div class="lock-icon">✈</div>
    <div class="eyebrow">Travel Journal</div>
    <h1>여행 기록</h1>
    <p class="lock-sub">비밀번호를 입력해 주세요</p>
    <input type="password" id="pw" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호" autofocus>
    <div class="lock-err" id="pwErr" aria-live="polite"></div>
    <button type="submit" class="btn primary lock-btn">들어가기</button>
    <button type="button" class="hint-toggle" onclick="toggleHint()">힌트 보기</button>
    <div class="hint" id="hint" hidden>Our beginning</div>
  </form>
</div>
<div class="wrap" id="app" hidden></div>

<dialog id="modal">
  <form id="modalForm">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button type="button" class="btn" onclick="closeModal()">취소</button>
      <button type="submit" class="btn primary" id="modalOk">저장</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
/* ========== 저장소 ========== */
const KEY = 'travelLog.v1';
let state = load();
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.trips)) return s;
  }catch(e){}
  return {trips:[], currentTripId:null, tab:'schedule', selDate:null, expFilter:'all'};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('저장 실패: 브라우저 저장공간을 확인하세요'); }
}

/* ========== 유틸 ========== */
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return ds(d); };
const WD = ['일','월','화','수','목','금','토'];
const todayStr = () => ds(new Date());
function rangeDates(a,b){
  const out = []; if(!a || !b || a > b) return out;
  for(let s = a; s <= b && out.length < 400; s = addDays(s,1)) out.push(s);
  return out;
}
function fmtDate(s, withYear){
  if(!s) return '';
  const d = pd(s);
  return `${withYear ? d.getFullYear()+'. ' : ''}${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;
}
function fmtDT(v){
  if(!v) return '';
  const [dPart,t] = v.split('T'); const d = pd(dPart);
  return `${d.getMonth()+1}.${d.getDate()} (${WD[d.getDay()]}) ${t||''}`;
}
const money = n => Number(n||0).toLocaleString('ko-KR',{maximumFractionDigits:2});
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1800);
}
const curTrip = () => state.trips.find(t => t.id === state.currentTripId);
function dday(t){
  if(!t.start) return '';
  const today = todayStr();
  if(today < t.start){ const n = Math.round((pd(t.start)-pd(today))/864e5); return `D-${n}`; }
  if(t.end && today > t.end) return '다녀옴';
  return `여행 중 · Day ${Math.round((pd(today)-pd(t.start))/864e5)+1}`;
}

/* ========== 모달 ========== */
const modal = document.getElementById('modal');
const modalForm = document.getElementById('modalForm');
function openModal(title, html, onSave, okText='저장'){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOk').textContent = okText;
  modalForm.onsubmit = e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(modalForm));
    if(onSave(data, modalForm) === false) return;
    closeModal(); render();
  };
  modal.showModal();
  const first = modalForm.querySelector('#modalBody input, #modalBody select, #modalBody textarea');
  if(first) first.focus();
}
function closeModal(){ modal.close(); }
// 브라우저 기본 confirm 대신 앱 안의 확인창 사용 (일부 환경에서 confirm이 막혀 삭제가 안 되는 문제 방지)
function ask(msg, onYes, okText='삭제'){
  openModal('확인', `<p style="white-space:pre-wrap;margin:0">${esc(msg)}</p>`, () => { onYes(); }, okText);
  document.getElementById('modalOk').focus();
}
// 한글 입력(IME) 조합 중 Enter는 무시
const enter = (e, fn) => { if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); fn(); } };

/* ========== 렌더 ========== */
function render(){
  const t = curTrip();
  if(!t){ state.currentTripId = null; renderHome(); }
  else renderTrip(t);
  save();
}
function go(tripId){ state.currentTripId = tripId; state.selDate = null; render(); window.scrollTo(0,0); }
function setTab(tab){ state.tab = tab; render(); }

/* ---------- 홈 ---------- */
function renderHome(){
  const trips = [...state.trips].sort((a,b) => (b.start||'').localeCompare(a.start||''));
  const upcoming = trips.filter(t => t.end >= todayStr()).length;
  document.getElementById('app').innerHTML = `
    <div class="hero">
      <div class="eyebrow">Travel Journal</div>
      <h1>여행 기록</h1>
      <p>${trips.length ? `지금까지 ${trips.length}개의 여행 · 다가오는 여행 ${upcoming}개` : '일정, 준비, 항공권, 경비를 한곳에서 관리하세요'}</p>
      <div class="row">
        <button class="btn primary" onclick="tripModal()">+ 새 여행</button>
        <div class="spacer"></div>
        <button class="btn sm" onclick="exportData()">백업 내보내기</button>
        <button class="btn sm" onclick="document.getElementById('importFile').click()">백업 불러오기</button>
      </div>
    </div>
    ${trips.length ? `<div class="section-title"><h2 style="margin:0">내 여행</h2><span class="muted small">모든 기록은 이 브라우저에 자동 저장됩니다</span></div>
    <div class="trips">${trips.map(t => `
      <div class="trip-card" tabindex="0" onclick="go('${t.id}')" onkeydown="if(event.key==='Enter')go('${t.id}')">
        <div class="cover" style="--h:${tripHue(t)}">
          ${dday(t) ? `<span class="dday">${dday(t)}</span>` : ''}
        </div>
        <div class="acts">
          <button class="icon-btn" title="수정" onclick="event.stopPropagation();tripModal('${t.id}')">✎</button>
          <button class="icon-btn" title="삭제" onclick="event.stopPropagation();delTrip('${t.id}')">🗑</button>
        </div>
        <div class="body">
          <div class="dest">${esc(t.dest || '목적지 미정')}</div>
          <div class="name">${esc(t.name)}</div>
          <div class="muted small">${t.start ? `${fmtDate(t.start,true)} ~ ${fmtDate(t.end)} · ${rangeDates(t.start,t.end).length}일` : '날짜 미정'}</div>
          <div class="stats">
            <span class="badge gray">👥 ${t.people.length}명</span>
            <span class="badge gray">✈ 항공 ${t.flights.length}</span>
            <span class="badge gray">💰 지출 ${t.expenses.length}건</span>
          </div>
        </div>
      </div>`).join('')}</div>`
    : `<div class="empty panel"><div class="big">🧳</div><p>아직 등록된 여행이 없어요.</p><button class="btn primary" onclick="tripModal()">+ 첫 여행 등록하기</button></div>`}
  `;
}

// 여행마다 고유한 커버 색상
function tripHue(t){ let h = 0; for(const c of (t.dest || t.name) + t.id) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
const DEFAULT_PREP = [
  ['서류','여권 (유효기간 6개월 이상)'],['서류','항공권 e-티켓'],['서류','여행자 보험'],
  ['예약','숙소 예약 확인'],['금융','환전 / 해외결제 카드'],['전자기기','유심 / eSIM'],
  ['전자기기','충전기 · 보조배터리 · 멀티어댑터'],['상비약','상비약'],['세면도구','세면도구'],['의류','옷 · 잠옷 · 속옷']
];
/* ---------- 통화 ---------- */
const COMMON_CURS = [['KRW','원'],['EUR','유로'],['USD','달러'],['JPY','엔'],['GBP','파운드'],['CNY','위안'],['TWD','대만달러'],['HKD','홍콩달러'],['THB','바트'],['VND','동'],['SGD','싱가포르달러'],['AUD','호주달러'],['CHF','스위스프랑']];
const parseCurs = s => [...new Set(String(s || '').split(/[,\s/]+/).map(x => x.toUpperCase().replace(/[^A-Z0-9가-힣$€¥£₩]/g, '').slice(0, 8)).filter(Boolean))];
// 여행에서 쓰는 통화 목록 (예전 데이터는 기본 통화 하나로 시작)
function tripCurs(t){
  if(!Array.isArray(t.currencies) || !t.currencies.length) t.currencies = parseCurs(t.currency || 'KRW');
  return t.currencies;
}
function syncCurPicks(){
  const inp = document.getElementById('curInput'); if(!inp) return;
  const list = parseCurs(inp.value);
  document.querySelectorAll('.cur-pick').forEach(b => b.classList.toggle('on', list.includes(b.dataset.c)));
}
function toggleCurInput(c){
  const inp = document.getElementById('curInput');
  let list = parseCurs(inp.value);
  list = list.includes(c) ? list.filter(x => x !== c) : [...list, c];
  inp.value = list.join(', '); syncCurPicks();
}
document.addEventListener('input', e => { if(e.target.id === 'curInput') syncCurPicks(); });
function curOptions(t, selected){
  const list = [...new Set([...tripCurs(t), ...(selected ? [selected] : [])])];
  return list.map(c => `<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}${(COMMON_CURS.find(x => x[0]===c) || [])[1] ? ' · ' + COMMON_CURS.find(x => x[0]===c)[1] : ''}</option>`).join('');
}

function tripModal(id){
  const t = id ? state.trips.find(x => x.id === id) : null;
  setTimeout(syncCurPicks);
  openModal(t ? '여행 정보 수정' : '새 여행 등록', `
    <label class="f">여행 이름 *<input type="text" name="name" required value="${esc(t?.name)}" placeholder="예) 2026 겨울 도쿄 여행"></label>
    <label class="f">목적지<input type="text" name="dest" value="${esc(t?.dest)}" placeholder="예) 일본 도쿄"></label>
    <div class="grid2">
      <label class="f">출발일 *<input type="date" name="start" required value="${esc(t?.start)}"></label>
      <label class="f">도착일 *<input type="date" name="end" required value="${esc(t?.end)}"></label>
    </div>
    <div class="grid2">
      <label class="f">${t ? '인원은 준비물 탭에서 수정' : '함께 가는 사람 (쉼표로 구분)'}
        <input type="text" name="people" ${t ? 'disabled' : ''} value="${esc(t ? t.people.join(', ') : '나')}" placeholder="나, 엄마, 동생"></label>
      <label class="f">사용 통화 (쉼표로 구분)<input type="text" name="currency" id="curInput" value="${esc(t ? tripCurs(t).join(', ') : 'KRW')}" placeholder="EUR, KRW"></label>
    </div>
    <div class="cur-picks">
      ${COMMON_CURS.map(([c,n]) => `<button type="button" class="cur-pick" data-c="${c}" onclick="toggleCurInput('${c}')">${c} <span>${n}</span></button>`).join('')}
    </div>
    <div class="muted small" style="margin-top:6px">맨 앞의 통화가 기본 통화예요. 경비를 기록할 때 여기서 고른 통화 중에서 선택할 수 있어요.</div>
  `, d => {
    if(d.end < d.start){ toast('도착일이 출발일보다 빠를 수 없어요'); return false; }
    const curs = parseCurs(d.currency);
    if(!curs.length){ toast('통화를 1개 이상 입력해 주세요'); return false; }
    if(t){ Object.assign(t, {name:d.name.trim(), dest:d.dest.trim(), start:d.start, end:d.end, currency:curs[0], currencies:curs}); }
    else{
      let people = [...new Set((d.people||'').split(',').map(s=>s.trim()).filter(Boolean))];
      if(!people.length) people = ['나'];
      state.trips.push({
        id:uid(), name:d.name.trim(), dest:d.dest.trim(), start:d.start, end:d.end, currency:curs[0], currencies:curs,
        people, stays:{}, schedules:{}, flights:[], expenses:[], cash:[],
        prep: DEFAULT_PREP.map(([cat,text]) => ({id:uid(), cat, text, checks:{}})),
        created: Date.now()
      });
      toast('여행이 등록되었어요');
    }
  });
}
function delTrip(id){
  const t = state.trips.find(x => x.id === id);
  ask(`'${t.name}' 여행과 모든 기록을 삭제할까요?\n삭제 후에는 되돌릴 수 없어요.`, () => {
    state.trips = state.trips.filter(x => x.id !== id);
  });
}

/* ---------- 여행 상세 ---------- */
const TABS = [['schedule','📅 일정'],['flight','✈️ 항공권'],['expense','💰 경비'],['prep','✅ 준비']];
function renderTrip(t){
  if(!TABS.some(x => x[0] === state.tab)) state.tab = 'schedule';
  const body = {schedule:renderSchedule, prep:renderPrep, flight:renderFlights, expense:renderExpenses}[state.tab](t);
  document.getElementById('app').innerHTML = `
    <div class="trip-head">
      <button class="back" title="여행 목록" onclick="go(null)">←</button>
      <div>
        <h1 style="font-size:23px">${esc(t.name)}</h1>
        <div class="meta">${esc(t.dest)}${t.dest ? ' · ' : ''}${fmtDate(t.start,true)} ~ ${fmtDate(t.end)} · ${rangeDates(t.start,t.end).length}일</div>
      </div>
      <div class="spacer"></div>
      ${dday(t) ? `<span class="badge">${dday(t)}</span>` : ''}
      <button class="icon-btn" title="여행 정보 수정" onclick="tripModal('${t.id}')">✎</button>
    </div>
    <div class="tabs">${TABS.map(([k,l]) => `<button class="tab ${state.tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div>
    ${body}
  `;
}

/* ---------- 1. 일정 (캘린더 + 숙소 + 타임라인) ---------- */
function renderSchedule(t){
  const dates = rangeDates(t.start, t.end);
  if(!dates.length) return `<div class="empty panel">여행 날짜를 먼저 설정해 주세요.</div>`;
  if(!dates.includes(state.selDate)) state.selDate = dates.includes(todayStr()) ? todayStr() : dates[0];
  const sel = state.selDate, today = todayStr();

  // 출발 월 ~ 도착 월 캘린더
  let months = '';
  const s = pd(t.start), e = pd(t.end);
  for(let y = s.getFullYear(), m = s.getMonth(); y < e.getFullYear() || (y === e.getFullYear() && m <= e.getMonth()); m === 11 ? (y++, m = 0) : m++){
    const first = new Date(y,m,1), last = new Date(y,m+1,0).getDate();
    let cells = WD.map((w,i) => `<div class="wd ${i===0?'sun':''}">${w}</div>`).join('');
    for(let i = 0; i < first.getDay(); i++) cells += '<div></div>';
    for(let d = 1; d <= last; d++){
      const k = ds(new Date(y,m,d)); const inT = k >= t.start && k <= t.end;
      const stay = t.stays[k]; const n = (t.schedules[k]||[]).length;
      cells += `<button class="cell ${inT?'in':''} ${k===sel?'sel':''} ${k===today?'today':''}" ${inT ? `onclick="selectDate('${k}')"` : 'disabled'}>
        <span class="dn">${d}</span>
        ${inT && stay ? `<span class="stay">🏨 ${esc(stay.name)}</span>` : ''}
        ${inT && n ? `<span class="cnt">• 일정 ${n}</span>` : ''}
      </button>`;
    }
    months += `<div class="month"><div class="month-title">${y}년 ${m+1}월</div><div class="cal">${cells}</div></div>`;
  }

  const dayN = dates.indexOf(sel) + 1;
  const stay = t.stays[sel];
  const items = [...(t.schedules[sel]||[])].sort((a,b) => (a.time||'99').localeCompare(b.time||'99'));
  return `
    <div class="sched">
      <div class="panel">${months}
        <div class="muted small">날짜를 누르면 오른쪽에서 숙소와 일정을 기록할 수 있어요.</div>
      </div>
      <div class="panel">
        <div class="row">
          <span class="badge">Day ${dayN}</span>
          <h2 style="margin:0">${fmtDate(sel)}</h2>
          <div class="spacer"></div>
          <button class="icon-btn" title="이전 날" ${dayN<=1?'disabled':''} onclick="selectDate('${addDays(sel,-1)}')">◀</button>
          <button class="icon-btn" title="다음 날" ${dayN>=dates.length?'disabled':''} onclick="selectDate('${addDays(sel,1)}')">▶</button>
        </div>
        <div class="stay-box">

const PREP_CATS = ['서류','예약','금융','전자기기','의류','세면도구','상비약','기타'];
const isDone = (t,it) => t.people.length > 0 && t.people.every(p => it.checks[p]);

function prepCats(t){
  if(!Array.isArray(t.prepCats)) t.prepCats = [...new Set([...PREP_CATS, ...t.prep.map(i => i.cat).filter(Boolean)])];

        <td class="item" title="클릭하면 전원 체크/해제" onclick="toggleAll('${it.id}')">${esc(it.text)}</td>
        ${t.people.map((p,i) => `<td><input type="checkbox" aria-label="${esc(p)}" ${it.checks[p]?'checked':''} onchange="togglePrep('${it.id}',${i})"></td>`).join('')}
        <td class="memo-cell"><input type="text" class="memo-in" value="${esc(it.memo)}" placeholder="메모" onchange="setPrepMemo('${it.id}',this.value)" onkeydown="enter(event,()=>this.blur())"></td>
        <td class="acts"><button class="icon-btn" onclick="prepModal('${it.id}')">✎</button><button class="icon-btn del" onclick="delPrep('${it.id}')">🗑</button></td>

  return `
    <div class="panel" style="margin-bottom:14px">
      <div class="row" style="margin-bottom:10px"><h3>👥 인원</h3><span class="muted small">사람마다 체크 칸이 생겨요</span></div>
      <div class="people">
        ${t.people.map((p,i) => `<span class="chip" data-i="${esc([...p][0] || '')}">${esc(p)}<button title="삭제" onclick="delPerson(${i})">✕</button></span>`).join('')}
        <input type="text" id="newPerson" placeholder="이름 추가" style="width:130px" onkeydown="enter(event,addPerson)">
        <button class="btn sm" onclick="addPerson()">추가</button>

      <div class="row" style="margin:18px 0 10px"><h3>🏷️ 분류</h3><span class="muted small">이름을 누르면 수정, ✕를 누르면 삭제돼요</span></div>
      <div class="people">
        ${prepCats(t).map((c,i) => `<span class="chip tag"><span class="tag-name" title="이름 수정" onclick="catModal(${i})">${esc(c)}</span><span class="tag-n">${t.prep.filter(x => x.cat === c).length}</span><button title="삭제" onclick="delCat(${i})">✕</button></span>`).join('')}
        <input type="text" id="newCatName" placeholder="분류 추가" style="width:130px" onkeydown="enter(event,addCat)">
        <button class="btn sm" onclick="addCat()">추가</button>
      </div>
    </div>
    <div class="panel">
      <div class="row" style="margin-bottom:8px"><h3>준비 사항</h3><div class="spacer"></div><b>${done} / ${total}</b><span class="muted small">완료 (${pct}%)</span></div>
      <div class="progress" style="margin-bottom:14px"><div style="width:${pct}%"></div></div>
      <div class="row" style="margin-bottom:6px">
        <select id="newCat" style="width:auto" onchange="state.lastCat=this.value">${prepCats(t).map(c => `<option ${c===state.lastCat?'selected':''}>${esc(c)}</option>`).join('')}</select>
        <input type="text" id="newPrep" placeholder="준비할 것 입력 후 Enter" style="flex:1;min-width:160px" onkeydown="enter(event,addPrep)">

          <tbody>${rows || `<tr><td colspan="${t.people.length+4}" class="muted" style="padding:24px">준비 사항을 추가해 보세요</td></tr>`}</tbody>

    </div>`;
}

function catModal(i){

  openModal('분류 이름 수정', `<label class="f">분류 이름 *<input type="text" name="name" required value="${esc(old)}"></label>`, d => {

function delCat(i){
  const t = curTrip(), cats = prepCats(t), c = cats[i];
  if(cats.length <= 1){ toast('분류는 최소 1개 있어야 해요'); return; }
  const n = t.prep.filter(it => it.cat === c).length;
  const to = cats.find(x => x !== c);
  ask(`'${c}' 분류를 삭제할까요?` + (n ? `\n이 분류의 항목 ${n}개는 '${to}' 분류로 옮겨져요.` : ''), () => {
    t.prepCats = cats.filter(x => x !== c);

  });

// 같은 분류 안에서 바로 위/아래 항목과 자리 바꾸기
function movePrep(id, dir){
  const t = curTrip(), i = t.prep.findIndex(x => x.id === id);
  if(i < 0) return;
  const cat = t.prep[i].cat;
  let j = i + dir;
  while(j >= 0 && j < t.prep.length && t.prep[j].cat !== cat) j += dir;
  if(j < 0 || j >= t.prep.length) return;
  [t.prep[i], t.prep[j]] = [t.prep[j], t.prep[i]];
  render();
  const row = document.querySelector(`tr[data-id="${id}"]`);
  if(row){ row.classList.add('moved'); row.querySelector('.drag-handle')?.focus(); }
}
// 키보드: 손잡이에 초점을 두고 ↑/↓
function handleKey(e, id){
  if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){ e.preventDefault(); movePrep(id, e.key === 'ArrowUp' ? -1 : 1); }
}

/* 손잡이를 꾹 눌러 끌어서 순서 바꾸기 (마우스·터치 공통) */
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('.drag-handle');
  if(!h || e.button > 0) return;
  e.preventDefault();
  const row = h.closest('tr');
  drag = {row, h, id:row.dataset.id, cat:row.dataset.cat, pid:e.pointerId, active:false, y:e.clientY};
  try{ h.setPointerCapture(e.pointerId); }catch(err){}
  row.classList.add('pressing');
  drag.timer = setTimeout(() => {
    if(!drag) return;
    drag.active = true;
    row.classList.remove('pressing'); row.classList.add('dragging');
    document.body.classList.add('is-dragging');
    if(navigator.vibrate) try{ navigator.vibrate(15); }catch(err){}
  }, e.pointerType === 'mouse' ? 150 : 350);
});
document.addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.pid) return;
  drag.y = e.clientY;
  if(!drag.active) return;
  e.preventDefault();
  const others = [...document.querySelectorAll(`table.prep tr[data-cat="${drag.cat}"]`)].filter(r => r !== drag.row);
  if(!others.length) return;
  const before = others.find(r => { const b = r.getBoundingClientRect(); return e.clientY < b.top + b.height / 2; });
  if(before){ if(drag.row.nextElementSibling !== before) before.before(drag.row); }
  else{ const last = others[others.length - 1]; if(last.nextElementSibling !== drag.row) last.after(drag.row); }
  const m = 70;
  if(e.clientY < m) window.scrollBy(0, -12); else if(e.clientY > innerHeight - m) window.scrollBy(0, 12);
}, {passive:false});
function endDrag(e){
  if(!drag || (e && e.pointerId !== drag.pid)) return;
  clearTimeout(drag.timer);
  const {row, active, cat, id} = drag;
  row.classList.remove('pressing','dragging');
  document.body.classList.remove('is-dragging');
  drag = null;
  if(!active) return;
  const t = curTrip();
  const ids = [...document.querySelectorAll(`table.prep tr[data-cat="${cat}"]`)].map(r => r.dataset.id);
  const catName = t.prep.find(x => x.id === id)?.cat;
  const slots = t.prep.map((p, i) => p.cat === catName ? i : -1).filter(i => i >= 0);
  const byId = Object.fromEntries(t.prep.map(p => [p.id, p]));
  if(ids.length !== slots.length) { render(); return; }
  ids.forEach((pid, k) => t.prep[slots[k]] = byId[pid]);
  render();
  document.querySelector(`tr[data-id="${id}"]`)?.classList.add('moved');
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
function setPrepMemo(id, v){

  if(it){ it.memo = v.trim(); save(); }

function togglePrep(id,i){

function toggleAll(id){

    <label class="f">항목 *<input type="text" name="text" required value="${esc(it.text)}"></label>

/* ---------- 3. 항공권 ---------- */
const FL_LABELS = ['가는 편','오는 편','현지 이동','기타'];
function minsBetween(a,b){
  if(!a || !b) return null;
  const m = (new Date(b) - new Date(a)) / 60000;
  return isNaN(m) ? null : m;
}
const fmtMins = m => `${Math.floor(m/60)}시간 ${m%60 ? (m%60)+'분' : ''}`.trim();
function renderFlights(t){
  const list = [...t.flights].sort((a,b) => (a.segs[0]?.dep||'').localeCompare(b.segs[0]?.dep||''));

          <button class="icon-btn" onclick="flightModal('${f.id}')">✎</button>
          <button class="icon-btn del" onclick="delFlight('${f.id}')">🗑</button>
        </div>
        ${segs.map((s,i) => {
          let lay = '';
          if(i > 0){
            const m = minsBetween(segs[i-1].arr, s.dep);
            lay = `<div class="layover">⏱ ${esc(s.from || segs[i-1].to)} 경유 대기${m != null && m >= 0 ? ' · ' + fmtMins(m) : ''}</div>`;
          }
          return `${lay}<div class="seg">
            <div><div class="ap">${esc(s.from || '???')}</div><div class="t"><b>${fmtDT(s.dep)}</b></div>${s.fromT ? `<div class="small muted">터미널 ${esc(s.fromT)}</div>` : ''}</div>
            <div class="mid">${esc(s.airline)} ${esc(s.no)}<div class="line"></div>${s.seat ? '좌석 '+esc(s.seat) : ''}${s.seat && s.bag ? ' · ' : ''}${s.bag ? '수하물 '+esc(s.bag) : ''}</div>
            <div class="right"><div class="ap">${esc(s.to || '???')}</div><div class="t"><b>${fmtDT(s.arr)}</b></div>${s.toT ? `<div class="small muted">터미널 ${esc(s.toT)}</div>` : ''}</div>

      </div>`;
    }).join('') : `<div class="empty panel"><div style="font-size:36px">🎫</div><p>등록된 항공권이 없어요.<br>경유 항공편은 구간을 여러 개 추가하면 돼요.</p></div>`}
    <div class="muted small">시간은 모두 현지 시각 기준으로 입력하세요.</div>`;
}
function segFieldset(s={}, n){
  return `<fieldset class="segf"><legend>구간 <span class="segno">${n}</span> <button type="button" class="icon-btn del" onclick="removeSeg(this)" title="구간 삭제">✕</button></legend>
    <div class="grid2">
      <label class="f">항공사<input type="text" data-k="airline" value="${esc(s.airline)}" placeholder="대한항공"></label>
      <label class="f">편명<input type="text" data-k="no" value="${esc(s.no)}" placeholder="KE703"></label>
    </div>
    <div class="grid3">
      <label class="f">출발지<input type="text" data-k="from" value="${esc(s.from)}" placeholder="ICN"></label>
      <label class="f">출발 터미널<input type="text" data-k="fromT" value="${esc(s.fromT)}" placeholder="T2"></label>
      <label class="f">출발 일시<input type="datetime-local" data-k="dep" value="${esc(s.dep)}"></label>
    </div>
    <div class="grid3">
      <label class="f">도착지<input type="text" data-k="to" value="${esc(s.to)}" placeholder="NRT"></label>
      <label class="f">도착 터미널<input type="text" data-k="toT" value="${esc(s.toT)}"></label>
      <label class="f">도착 일시<input type="datetime-local" data-k="arr" value="${esc(s.arr)}"></label>
    </div>
    <div class="grid2">
      <label class="f">좌석<input type="text" data-k="seat" value="${esc(s.seat)}" placeholder="32A"></label>
      <label class="f">수하물<input type="text" data-k="bag" value="${esc(s.bag)}" placeholder="23kg x 1"></label>
    </div>
  </fieldset>`;
}
function addSeg(){
  const box = document.getElementById('segs');
  const prev = [...box.querySelectorAll('fieldset')].pop();
  const prevTo = prev ? prev.querySelector('[data-k=to]').value : '';
  box.insertAdjacentHTML('beforeend', segFieldset({from:prevTo}, box.children.length+1));
}
function removeSeg(btn){
  const box = document.getElementById('segs');
  if(box.children.length <= 1){ toast('최소 1개 구간이 필요해요'); return; }
  btn.closest('fieldset').remove();
  [...box.querySelectorAll('.segno')].forEach((el,i) => el.textContent = i+1);
}
function flightModal(id){
  const t = curTrip(), f = id ? t.flights.find(x => x.id === id) : {label: t.flights.length ? '오는 편' : '가는 편', segs:[{}]};
  openModal(id ? '항공권 수정' : '항공권 등록', `
    <div class="grid2">
      <label class="f">구분<select name="label">${FL_LABELS.map(l => `<option ${l===f.label?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f">예약번호<input type="text" name="ref" value="${esc(f.ref)}" placeholder="ABC123"></label>
    </div>
    <div id="segs">${f.segs.map((s,i) => segFieldset(s,i+1)).join('')}</div>
    <button type="button" class="btn sm" onclick="addSeg()" style="margin-bottom:12px">+ 경유 구간 추가</button>
    <label class="f">메모<textarea name="memo" placeholder="온라인 체크인, 라운지, 마일리지 등">${esc(f.memo)}</textarea></label>
  `, (d, form) => {
    const segs = [...form.querySelectorAll('#segs fieldset')].map(fs => {
      const s = {}; fs.querySelectorAll('[data-k]').forEach(inp => {
        let v = inp.value.trim();
        if(['from','to'].includes(inp.dataset.k)) v = v.toUpperCase();
        s[inp.dataset.k] = v;
      });
      return s;
    });
    const v = {label:d.label, ref:d.ref.trim(), memo:d.memo.trim(), segs};
    if(id) Object.assign(f, v); else t.flights.push({id:uid(), ...v});
  });
}
function delFlight(id){
  const t = curTrip();
  ask('이 항공권을 삭제할까요?', () => { t.flights = t.flights.filter(x => x.id !== id); });
}

/* ---------- 4. 경비 (카드 / 현금) ---------- */
const EXP_CATS = {'식비':'🍜','교통':'🚕','숙박':'🏨','쇼핑':'🛍️','관광':'🎟️','카페·간식':'☕','기타':'📌'};
function renderExpenses(t){
  const ex = t.expenses;
  // 통화 구분: 여행에 등록한 통화 + 기록에 쓰인 통화
  const allCurs = [...new Set([...tripCurs(t), ...ex.map(e => e.cur), ...t.cash.map(c => c.cur)])].filter(Boolean);
  if(state.expCur !== 'all' && !allCurs.includes(state.expCur)) state.expCur = allCurs.length > 1 ? 'all' : allCurs[0];
  const selCur = state.expCur;
  const shownCurs = selCur === 'all' ? allCurs : [selCur];
  const multi = allCurs.length > 1;
  const sumBy = (cur, fn) => ex.filter(e => e.cur === cur && (!fn || fn(e))).reduce((a,e) => a + Number(e.amount), 0);
  const curName = c => (COMMON_CURS.find(x => x[0] === c) || [])[1] || '';
  const summary = shownCurs.map(cur => {
    const total = sumBy(cur), card = sumBy(cur, e => e.method === 'card'), cash = sumBy(cur, e => e.method === 'cash');
    const wallet = t.cash.filter(c => c.cur === cur).reduce((a,c) => a + Number(c.amount), 0);
    return `
      ${multi ? `<div class="cur-head"><span class="cur-code">${esc(cur)}</span><span class="muted small">${esc(curName(cur))}</span></div>` : ''}
      <div class="sum-grid">
        <div class="sum"><div class="k">총 지출</div><div class="v">${money(total)}</div><div class="k">${esc(cur)}</div></div>
        <div class="sum card"><div class="k">💳 카드</div><div class="v">${money(card)}</div><div class="k">${total ? Math.round(card/total*100) : 0}%</div></div>
        <div class="sum cash"><div class="k">💵 현금</div><div class="v">${money(cash)}</div><div class="k">${total ? Math.round(cash/total*100) : 0}%</div></div>
        <div class="sum"><div class="k">현금 잔액</div><div class="v" style="color:${wallet-cash<0?'var(--warn)':'inherit'}">${wallet ? money(wallet - cash) : '-'}</div><div class="k">${wallet ? `환전 ${money(wallet)}` : '환전 현금 미등록'}</div></div>
      </div>`;
  }).join('');

  // 통화별 분석 (분류 / 카드 / 결제자) — 통화끼리는 합산하지 않음
  const analysis = cur => {
    const byCat = Object.keys(EXP_CATS).map(c => [c, sumBy(cur, e => e.cat === c)]).filter(x => x[1] > 0).sort((a,b) => b[1]-a[1]);
    if(!byCat.length) return '';
    const maxCat = Math.max(1, ...byCat.map(x => x[1]));
    const byPayer = t.people.map(p => [p, sumBy(cur, e => e.payer === p)]).filter(x => x[1] > 0);
    const byCard = [...new Set(ex.filter(e => e.cur === cur && e.method==='card' && e.card).map(e => e.card))].map(c => [c, sumBy(cur, e => e.method==='card' && e.card===c)]);
    return `<div class="panel" style="margin-bottom:14px">
      <div class="row" style="margin-bottom:6px"><h3>분류별 지출</h3><span class="badge gray">${esc(cur)}</span></div>
      ${byCat.map(([c,v]) => `<div class="bar-row"><span>${EXP_CATS[c]} ${c}</span><div class="bar"><div style="width:${v/maxCat*100}%"></div></div><span>${money(v)}</span></div>`).join('')}
      ${byCard.length ? `<div class="sub-h">카드별 사용</div>${byCard.map(([c,v]) => `<div class="row small" style="padding:3px 0"><span>💳 ${esc(c)}</span><div class="spacer"></div><b>${money(v)}</b></div>`).join('')}` : ''}
      ${byPayer.length > 1 ? `<div class="sub-h">결제자별</div>${byPayer.map(([p,v]) => `<div class="row small" style="padding:3px 0"><span>${esc(p)}</span><div class="spacer"></div><b>${money(v)}</b></div>`).join('')}` : ''}
    </div>`;
  };
  const analyses = shownCurs.map(analysis).join('');

  const f = state.expFilter || 'all';
  const shown = ex.filter(e => (f === 'all' || e.method === f) && shownCurs.includes(e.cur)).sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
  const days = [...new Set(shown.map(e => e.date))];
  const cashShown = t.cash.filter(c => shownCurs.includes(c.cur));

  return `
    <div class="row" style="margin-bottom:14px"><h2 style="margin:0">경비</h2><div class="spacer"></div>
      <button class="btn" onclick="cashModal()">+ 환전 현금</button>
      <button class="btn primary" onclick="expModal()">+ 지출 기록</button></div>
    ${multi ? `<div class="row" style="margin-bottom:14px"><span class="muted small" style="font-weight:700">통화</span>
      <div class="seg-ctl">${['all', ...allCurs].map(c => `<button class="${selCur===c?'on':''}" onclick="state.expCur='${esc(c)}';render()">${c==='all' ? '전체' : esc(c)}</button>`).join('')}</div>
      <span class="muted small">통화별로 따로 합계를 내요</span></div>` : ''}
    ${summary}
    <div class="exp-cols">
      <div>
        ${analyses || `<div class="panel" style="margin-bottom:14px"><h3 style="margin-bottom:8px">분류별 지출</h3><div class="muted small">아직 지출이 없어요</div></div>`}
        <div class="panel">
          <h3 style="margin-bottom:8px">💵 환전 현금</h3>
          ${cashShown.length ? cashShown.map(c => `<div class="row small" style="padding:3px 0"><span>${esc(c.date ? fmtDate(c.date) : '')} ${esc(c.memo)}</span><div class="spacer"></div><b>${money(c.amount)} ${esc(c.cur)}</b><button class="icon-btn del" onclick="delCash('${c.id}')">🗑</button></div>`).join('') : '<div class="muted small">환전한 현금을 등록하면 남은 현금을 계산해 드려요</div>'}
        </div>
      </div>
      <div class="panel">
        <div class="row"><h3>지출 내역</h3><div class="spacer"></div>
          <div class="seg-ctl">${[['all','전체'],['card','카드'],['cash','현금']].map(([k,l]) => `<button class="${f===k?'on':''}" onclick="state.expFilter='${k}';render()">${l}</button>`).join('')}</div></div>
        ${days.length ? days.map(day => {
          const list = shown.filter(e => e.date === day);
          const daySum = {}; list.forEach(e => daySum[e.cur] = (daySum[e.cur]||0) + Number(e.amount));
          return `<div class="exp-day"><span>${day ? fmtDate(day) : '날짜 없음'}</span><span>${Object.entries(daySum).map(([c,v]) => money(v)+' '+esc(c)).join(' · ')}</span></div>
            ${list.map(e => `<div class="exp">
              <div class="ic">${EXP_CATS[e.cat] || '📌'}</div>
              <div class="info"><div>${esc(e.title)}</div>
                <div class="row small" style="gap:4px">
                  <span class="badge ${e.method}">${e.method==='card' ? '💳 '+esc(e.card||'카드') : '💵 현금'}</span>
                  ${t.people.length > 1 && e.payer ? `<span class="muted">${esc(e.payer)}</span>` : ''}
                  ${e.time ? `<span class="muted">${esc(e.time)}</span>` : ''}
                </div></div>
              <div class="amt">${money(e.amount)} <span class="small muted">${esc(e.cur)}</span></div>
              <div><button class="icon-btn" onclick="expModal('${e.id}')">✎</button><button class="icon-btn del" onclick="delExp('${e.id}')">🗑</button></div>
            </div>`).join('')}`;
        }).join('') : `<div class="muted small" style="padding:24px 0;text-align:center">기록된 지출이 없어요</div>`}
      </div>
    </div>`;
}
function expModal(id){
  const t = curTrip();
  const today = todayStr();
  const defDate = today >= t.start && today <= t.end ? today : (state.selDate || t.start);
  const last = t.expenses[t.expenses.length-1];
  const e = id ? t.expenses.find(x => x.id === id)
    : {date:defDate, cur:(state.expCur && tripCurs(t).includes(state.expCur)) ? state.expCur : (tripCurs(t).includes(last?.cur) ? last.cur : tripCurs(t)[0]), method:last?.method || 'card', card:last?.card || '', payer:t.people[0], cat:'식비'};
  const cards = [...new Set(t.expenses.map(x => x.card).filter(Boolean))];
  openModal(id ? '지출 수정' : '지출 기록', `
    <div class="grid2">
      <label class="f">날짜<input type="date" name="date" value="${esc(e.date)}"></label>
      <label class="f">시간<input type="time" name="time" value="${esc(e.time)}"></label>
    </div>
    <label class="f">내용 *<input type="text" name="title" required value="${esc(e.title)}" placeholder="예) 점심 라멘"></label>
    <div class="grid2">
      <label class="f">금액 *<input type="number" name="amount" required step="any" min="0" inputmode="decimal" value="${esc(e.amount)}"></label>
      <label class="f">통화<select name="cur">${curOptions(t, e.cur)}</select></label>
    </div>
    <label class="f">분류<select name="cat">${Object.entries(EXP_CATS).map(([c,i]) => `<option value="${c}" ${c===e.cat?'selected':''}>${i} ${c}</option>`).join('')}</select></label>
    <div class="grid2">
      <label class="f">결제 수단<select name="method" onchange="document.getElementById('cardField').style.display=this.value==='card'?'':'none'">
        <option value="card" ${e.method==='card'?'selected':''}>💳 카드</option>
        <option value="cash" ${e.method==='cash'?'selected':''}>💵 현금</option></select></label>
      <label class="f">결제자<select name="payer">${t.people.map(p => `<option ${p===e.payer?'selected':''}>${esc(p)}</option>`).join('')}</select></label>
    </div>
    <label class="f" id="cardField" style="${e.method==='card'?'':'display:none'}">카드 이름<input type="text" name="card" value="${esc(e.card)}" list="cardList" placeholder="예) 트래블월렛, 신한카드">
      <datalist id="cardList">${cards.map(c => `<option value="${esc(c)}">`).join('')}</datalist></label>
    <label class="f">메모<input type="text" name="memo" value="${esc(e.memo)}"></label>
  `, d => {
    const v = {date:d.date, time:d.time, title:d.title.trim(), amount:Number(d.amount), cur:d.cur || tripCurs(t)[0],
      cat:d.cat, method:d.method, card:d.method==='card' ? d.card.trim() : '', payer:d.payer, memo:d.memo.trim()};
    if(id) Object.assign(e, v); else { t.expenses.push({id:uid(), ...v}); toast('지출이 기록되었어요'); }
  });
}
function delExp(id){
  const t = curTrip();
  ask('이 지출 기록을 삭제할까요?', () => { t.expenses = t.expenses.filter(x => x.id !== id); });
}
function cashModal(){
  const t = curTrip();
  openModal('환전 현금 등록', `
    <div class="grid2">
      <label class="f">금액 *<input type="number" name="amount" required step="any" min="0" inputmode="decimal"></label>
      <label class="f">통화<select name="cur">${curOptions(t, (state.expCur && tripCurs(t).includes(state.expCur)) ? state.expCur : tripCurs(t)[0])}</select></label>
    </div>
    <div class="grid2">
      <label class="f">날짜<input type="date" name="date" value="${todayStr()}"></label>
      <label class="f">메모<input type="text" name="memo" placeholder="예) 공항 환전소"></label>
    </div>
  `, d => { t.cash.push({id:uid(), amount:Number(d.amount), cur:d.cur || tripCurs(t)[0], date:d.date, memo:d.memo.trim()}); });
}
function delCash(id){
  const t = curTrip();
  ask('이 환전 기록을 삭제할까요?', () => { t.cash = t.cash.filter(x => x.id !== id); });
}

/* ========== 백업 ========== */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `여행기록_백업_${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
}
document.getElementById('importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    if(!Array.isArray(data.trips)) throw 0;
    ask(`백업에서 ${data.trips.length}개 여행을 불러올까요?\n현재 기록은 백업 내용으로 바뀝니다.`, () => { state = data; toast('불러오기 완료'); }, '불러오기');
  }catch(err){ toast('올바른 백업 파일이 아니에요'); }
  finally{ e.target.value = ''; }
});

// 다른 탭에서 수정했을 때 동기화
window.addEventListener('storage', e => { if(e.key === KEY && unlocked){ state = load(); render(); } });

/* ========== 비밀번호 잠금 ========== */
// 비밀번호 원문 대신 해시값만 저장
const PW_HASH = '9g0ikvbcnx';
const UNLOCK_KEY = 'travelLog.unlocked';
let unlocked = false;
function pwHash(str, seed = 7){
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for(let i = 0, ch; i < str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
function unlock(){
  unlocked = true;
  try{ sessionStorage.setItem(UNLOCK_KEY, PW_HASH); }catch(e){}
  document.getElementById('lock').hidden = true;
  document.getElementById('app').hidden = false;
  render();
}
function tryUnlock(){
  const inp = document.getElementById('pw'), err = document.getElementById('pwErr');
  if(pwHash(inp.value.trim()) === PW_HASH){ unlock(); return; }
  err.textContent = inp.value ? '비밀번호가 맞지 않아요' : '비밀번호를 입력해 주세요';
  const card = document.querySelector('.lock-card');
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  inp.select();
}
function toggleHint(){
  const h = document.getElementById('hint'), b = document.querySelector('.hint-toggle');
  h.hidden = !h.hidden; b.textContent = h.hidden ? '힌트 보기' : '힌트 숨기기';
}
// 같은 탭에서 새로고침할 때는 다시 묻지 않음 (창을 닫았다 열면 다시 입력)
let already = false;
try{ already = sessionStorage.getItem(UNLOCK_KEY) === PW_HASH; }catch(e){}
if(already) unlock(); else document.getElementById('pw').focus();
</script>
